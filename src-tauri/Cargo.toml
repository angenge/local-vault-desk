[package]
name = "local_vault_desk"
version = "1.0.0"
description = "LocalVaultDesk - 本地文件保险箱 using Rclone crypt and Tauri 2.0"
authors = ["LocalVaultDesk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_vault_desk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
tokio = { version = "1", features = ["full"] }
flate2 = "1.0"
